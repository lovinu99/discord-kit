name: Bug report
description: Report a reproducible problem
title: "bug: "
body:
  - type: markdown
    attributes:
      value: Do not include webhook URLs, tokens, or private logs.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
    validations:
      required: true